# Sveltia CMS configuratie voor de Zweedse site van De Machinedokters (demachinedokters.se)
# Inloggen: ga naar <site>/admin/ en kies "Sign in with Token" (GitHub personal access token met schrijfrechten op deze repo)
# of "Work with Local Repository" als je lokaal werkt met `npm run dev`.
#
# Alle inhoud staat per taal: 🇸🇪 Zweeds (hoofdtaal, op /) en 🇬🇧 Engels (op /en/).
# De veldlijsten staan één keer bij de Zweedse collectie (&naam) en worden bij de Engelse hergebruikt (*naam).
# LET OP bij livegang: site_url, display_url en logo_url hieronder aanpassen naar https://demachinedokters.se

backend:
  name: github
  repo: mdb668/demachinedokters-se
  branch: main
  commit_messages:
    create: "Nieuw: {{collection}} “{{slug}}”"
    update: "Bijgewerkt: {{collection}} “{{slug}}”"
    delete: "Verwijderd: {{collection}} “{{slug}}”"
    uploadMedia: "Afbeelding toegevoegd: {{path}}"
    deleteMedia: "Afbeelding verwijderd: {{path}}"

site_url: https://mdb668.github.io/demachinedokters-se
display_url: https://mdb668.github.io/demachinedokters-se
logo_url: https://mdb668.github.io/demachinedokters-se/images/logo-de-machinedokters-donker.png

media_folder: public/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

# ───────────── Herbruikbare velden ─────────────
# (Sveltia meldt in de console dat "x-fields" onbekend is; dat is onschuldig, het is alleen een opslagplek voor de veldlijsten.)
x-fields:
  review: &review { name: review, label: "Controle-markering", widget: string, required: false, hint: "Staat op 'sv-native-check-nodig' zolang een Zweedse moedertaalspreker de tekst nog niet heeft nagekeken. Maak leeg als de tekst is goedgekeurd." }
